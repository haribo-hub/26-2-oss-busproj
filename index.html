<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6002번 버스 좌석 예측</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <!-- Üst Başlık -->
    <header class="header">
      <div class="bus-info">
        <span class="bus-badge">6002번</span>
        <span class="bus-type">공항리무진</span>
      </div>
      <span class="update-time" id="updated-at">업데이트: --:--:--</span>
    </header>

    <!-- Hedef Durak Bilgisi -->
    <section class="route-box">
      <span class="route-label">목표 정류장</span>
      <h1 class="stop-name" id="target-stop">불러오는 중...</h1>
      <p class="vehicle-id" id="vehicle-id">차량번호: -</p>
    </section>

    <!-- Mevcut ve Tahmini Koltuk Kartları -->
    <section class="seats-grid">
      <div class="seat-card">
        <span class="card-label">현재 좌석</span>
        <div class="seat-value" id="current-seats">-</div>
      </div>

      <div class="seat-card" id="predicted-card">
        <span class="card-label">도착 시 예상 좌석</span>
        <div class="seat-value" id="predicted-seats">-</div>
      </div>
    </section>

    <!-- Durum / Tahmin Bekleme Nedeni Kutusu -->
    <section class="status-box pending" id="status-box">
      <div class="status-title" id="status-title">예측 보류 중</div>
      <p class="status-message" id="status-message">데이터를 확인하고 있습니다...</p>
    </section>

    <!-- Geliştirme Test Paneli (Gerçek API bağlanınca kaldırılacak) -->
    <footer class="dev-controls">
      <p class="dev-title">테스트용 가상 데이터 전환</p>
      <div class="dev-buttons">
        <button type="button" id="btn-mock-pending" class="active">예측 보류 상태</button>
        <button type="button" id="btn-mock-ready">예측 완료 상태</button>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
